name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  deploy:
    # Fork PRs must never receive the Cloudflare secrets or deploy rights.
    # Build/validate runs everywhere; deploy is push-to-main or same-repo PRs.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Astro Website
        run: npm run build
        env:
          PUBLIC_BACKEND_URL: ${{ secrets.PUBLIC_BACKEND_URL }}

      - name: Validate Cloudflare Credentials
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN secret is empty or not set"
            exit 1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID secret is empty or not set"
            exit 1
          fi
          npx --yes wrangler@4.158.0 pages project list
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Fail fast (with a readable error) if the Pages Functions cannot be
      # bundled, instead of surfacing it later as an opaque publish error.
      - name: Validate Pages Functions
        run: |
          npx --yes wrangler@4.158.0 pages functions build functions \
            --outdir .wrangler/functions-build

      # "Failed to publish your Function. Got error: Unknown internal error
      # occurred." is a generic Cloudflare API error. The Functions bundle is
      # valid (it compiles locally), so this is almost always a transient
      # edge/propagation issue. Retry a couple of times before giving up.
      - name: Deploy to Cloudflare Pages
        run: |
          branch="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          for attempt in 1 2 3; do
            echo "::group::Cloudflare Pages deploy attempt ${attempt}/3"
            if npx --yes wrangler@4.158.0 pages deploy dist \
              --project-name=websitetoapp \
              --branch="${branch}"; then
              echo "::endgroup::"
              echo "Deployment succeeded on attempt ${attempt}."
              exit 0
            fi
            echo "::endgroup::"
            if [ "${attempt}" -lt 3 ]; then
              delay=$((attempt * 20))
              echo "Deployment failed (attempt ${attempt}/3). Retrying in ${delay}s..."
              sleep "${delay}"
            fi
          done
          echo "::error::Cloudflare Pages deployment failed after 3 attempts. If the error was 'Failed to publish your Function. Got error: Unknown internal error occurred.', re-run the job; if it persists, check the Pages project for a conflicting binding or variable (for example, anything named ASSETS) and the Cloudflare status page."
          exit 1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
