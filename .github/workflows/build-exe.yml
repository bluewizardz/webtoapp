name: Build Windows EXE Wrapper

on:
  workflow_dispatch:
    inputs:
      siteUrl:
        description: 'Website URL to wrap (e.g. https://example.com)'
        required: true
        default: 'https://example.com'
      appName:
        description: 'Application Name'
        required: true
        default: 'My Web App'
      appId:
        description: 'Application ID (e.g. com.example.app)'
        required: true
        default: 'com.example.app'
      appVersion:
        description: 'Application Version'
        required: true
        default: '1.0.0'
      installerType:
        description: 'Installer type: nsis or portable'
        required: true
        default: 'nsis'
      engine:
        description: 'Build engine: electron (~70-90 MB) or tauri (~5-10 MB)'
        required: true
        default: 'electron'
      windowWidth:
        description: 'Default window width'
        required: true
        default: '1200'
      windowHeight:
        description: 'Default window height'
        required: true
        default: '800'
      fullScreen:
        description: 'Launch in full screen'
        type: boolean
        required: true
        default: false
      customUserAgent:
        description: 'Custom User Agent (Optional)'
        required: false
        default: ''
      buildId:
        description: 'Internal Build ID'
        required: true
        default: 'latest'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: 'npm'

      # Electron and NSIS toolchains are ~200MB of downloads. Caching them is the
      # single biggest speed win: cold builds lose 2-3 minutes to this alone.
      - name: Cache Electron and electron-builder toolchains
        if: ${{ github.event.inputs.engine != 'tauri' }}
        uses: actions/cache@v4
        with:
          path: |
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: electron-win-${{ hashFiles('builders/windows-builder.js', 'builders/build-utils.js') }}
          restore-keys: |
            electron-win-

      # Tauri compiles the wrapper in Rust, so it needs the toolchain. It is
      # preinstalled on windows-latest but we pin stable explicitly to avoid drift.
      - name: Set up Rust (Tauri)
        if: ${{ github.event.inputs.engine == 'tauri' }}
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies (Tauri)
        if: ${{ github.event.inputs.engine == 'tauri' }}
        uses: actions/cache@v4
        with:
          path: |
            ~\.cargo\registry
            ~\.cargo\git
          key: rust-tauri-${{ hashFiles('builders/tauri-builder.js') }}
          restore-keys: |
            rust-tauri-

      - name: Install Dependencies
        run: npm ci

      - name: Compile Windows EXE
        shell: bash
        run: |
          node cli-build-exe.js \
            "${{ github.event.inputs.siteUrl }}" \
            "${{ github.event.inputs.appName }}" \
            "${{ github.event.inputs.appId }}" \
            "${{ github.event.inputs.appVersion }}" \
            "${{ github.event.inputs.installerType }}" \
            "${{ github.event.inputs.windowWidth }}" \
            "${{ github.event.inputs.windowHeight }}" \
            "${{ github.event.inputs.fullScreen }}" \
            "${{ github.event.inputs.customUserAgent }}" \
            "${{ github.event.inputs.buildId }}" \
            "${{ github.event.inputs.engine }}"

      # The artifact is what the status endpoint polls for.
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: 'build-${{ github.event.inputs.buildId }}'
          path: 'builds-cli/${{ github.event.inputs.buildId }}/*.exe'
          if-no-files-found: error

      # The installer is stored on a DRAFT release: it gives us a direct CDN
      # download (via a signed asset URL) without cluttering the public
      # Releases section. The Cloudflare function resolves the draft with the
      # GITHUB_PAT (which needs Contents access) and redirects the browser.
      - name: Publish Installer as Draft Release Asset
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="build-${{ github.event.inputs.buildId }}"
          gh release create "$TAG" builds-cli/${{ github.event.inputs.buildId }}/*.exe \
            --repo "${{ github.repository }}" \
            --title "Windows build $TAG" \
            --notes "Automated Windows EXE for ${{ github.event.inputs.siteUrl }}" \
            --draft
