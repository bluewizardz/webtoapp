name: Build Windows EXE Wrapper
run-name: app-build-${{ inputs.buildId }}

on:
  workflow_dispatch:
    inputs:
      siteUrl:
        description: 'Website URL to wrap (e.g. https://example.com)'
        required: true
        default: 'https://example.com'
      appName:
        description: 'Application Name'
        required: true
        default: 'My Web App'
      appId:
        description: 'Application ID (e.g. com.example.app)'
        required: true
        default: 'com.example.app'
      appVersion:
        description: 'Application Version'
        required: true
        default: '1.0.0'
      installerType:
        description: 'Installer type: nsis or portable'
        required: true
        default: 'nsis'
      engine:
        description: 'Build engine: electron (~70-90 MB) or tauri (~5-10 MB)'
        required: true
        default: 'electron'
      windowWidth:
        description: 'Default window width'
        required: true
        default: '1200'
      windowHeight:
        description: 'Default window height'
        required: true
        default: '800'
      fullScreen:
        description: 'Launch in full screen'
        type: boolean
        required: true
        default: false
      customUserAgent:
        description: 'Custom User Agent (Optional)'
        required: false
        default: ''
      icon:
        description: 'Optional Base64 image data URL for the app icon'
        required: false
        default: ''
      autoFetchIcon:
        description: 'Fetch a website favicon when no valid custom icon is provided'
        type: boolean
        required: true
        default: true
      buildId:
        description: 'Internal Build ID'
        required: true
        default: 'latest'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: 'npm'

      # Electron and NSIS toolchains are ~200MB of downloads. Caching them is the
      # single biggest speed win: cold builds lose 2-3 minutes to this alone.
      - name: Cache Electron and electron-builder toolchains
        if: ${{ github.event.inputs.engine != 'tauri' }}
        uses: actions/cache@v4
        with:
          path: |
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: electron-win-${{ hashFiles('builders/windows-builder.js', 'builders/build-utils.js') }}
          restore-keys: |
            electron-win-

      - name: Cache shared Electron dependencies
        if: ${{ github.event.inputs.engine != 'tauri' }}
        uses: actions/cache@v4
        with:
          path: builds-cli/cache/electron-shared/node_modules
          key: electron-node-modules-win-node22-${{ hashFiles('builders/windows-builder.js', 'builders/build-utils.js') }}

      # Tauri compiles the wrapper in Rust, so it needs the toolchain. It is
      # preinstalled on windows-latest but we pin stable explicitly to avoid drift.
      - name: Set up Rust (Tauri)
        if: ${{ github.event.inputs.engine == 'tauri' }}
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies (Tauri)
        if: ${{ github.event.inputs.engine == 'tauri' }}
        uses: actions/cache@v4
        with:
          path: |
            ~\.cargo\registry
            ~\.cargo\git
          key: rust-tauri-${{ runner.os }}-${{ hashFiles('builders/tauri-builder.js') }}
          restore-keys: |
            rust-tauri-${{ runner.os }}-

      - name: Cache Tauri CLI and compiled dependencies
        if: ${{ github.event.inputs.engine == 'tauri' }}
        uses: actions/cache@v4
        with:
          path: |
            builds-cli/cache/tauri-shared
            builds-cli/cache/tauri-target
          key: tauri-build-${{ runner.os }}-${{ hashFiles('builders/tauri-builder.js') }}
          restore-keys: |
            tauri-build-${{ runner.os }}-

      - name: Install Dependencies
        run: npm ci

      - name: Validate inputs
        shell: bash
        env:
          INPUT_BUILD_ID: ${{ inputs.buildId }}
          INPUT_SITE_URL: ${{ inputs.siteUrl }}
          INPUT_WINDOW_WIDTH: ${{ inputs.windowWidth }}
          INPUT_WINDOW_HEIGHT: ${{ inputs.windowHeight }}
          INPUT_INSTALLER_TYPE: ${{ inputs.installerType }}
          INPUT_ENGINE: ${{ inputs.engine }}
        run: |
          if ! [[ "$INPUT_BUILD_ID" =~ ^[A-Za-z0-9][A-Za-z0-9_-]{0,63}$ ]]; then
            echo "Invalid buildId: must match ^[A-Za-z0-9][A-Za-z0-9_-]{0,63}\$"
            exit 1
          fi
          if ! [[ "$INPUT_SITE_URL" =~ ^https?:// ]]; then
            echo "Invalid siteUrl: must start with http:// or https://"
            exit 1
          fi
          if ! [[ "$INPUT_WINDOW_WIDTH" =~ ^[0-9]{2,5}$ && "$INPUT_WINDOW_HEIGHT" =~ ^[0-9]{2,5}$ ]]; then
            echo "Invalid window dimensions: must be numeric"
            exit 1
          fi
          if [[ "$INPUT_INSTALLER_TYPE" != nsis && "$INPUT_INSTALLER_TYPE" != portable ]]; then
            echo "Invalid installerType: must be 'nsis' or 'portable'"
            exit 1
          fi
          if [[ "$INPUT_ENGINE" != electron && "$INPUT_ENGINE" != tauri ]]; then
            echo "Invalid engine: must be 'electron' or 'tauri'"
            exit 1
          fi

      - name: Compile Windows EXE
        shell: bash
        env:
          APP_ICON: ${{ inputs.icon }}
          AUTO_FETCH_ICON: ${{ inputs.autoFetchIcon }}
          INPUT_SITE_URL: ${{ inputs.siteUrl }}
          INPUT_APP_NAME: ${{ inputs.appName }}
          INPUT_APP_ID: ${{ inputs.appId }}
          INPUT_APP_VERSION: ${{ inputs.appVersion }}
          INPUT_INSTALLER_TYPE: ${{ inputs.installerType }}
          INPUT_WINDOW_WIDTH: ${{ inputs.windowWidth }}
          INPUT_WINDOW_HEIGHT: ${{ inputs.windowHeight }}
          INPUT_FULL_SCREEN: ${{ inputs.fullScreen }}
          INPUT_CUSTOM_USER_AGENT: ${{ inputs.customUserAgent }}
          INPUT_BUILD_ID: ${{ inputs.buildId }}
          INPUT_ENGINE: ${{ inputs.engine }}
        run: |
          node cli-build-exe.js \
            "$INPUT_SITE_URL" \
            "$INPUT_APP_NAME" \
            "$INPUT_APP_ID" \
            "$INPUT_APP_VERSION" \
            "$INPUT_INSTALLER_TYPE" \
            "$INPUT_WINDOW_WIDTH" \
            "$INPUT_WINDOW_HEIGHT" \
            "$INPUT_FULL_SCREEN" \
            "$INPUT_CUSTOM_USER_AGENT" \
            "$INPUT_BUILD_ID" \
            "$INPUT_ENGINE"

      # The artifact is what the status endpoint polls for.
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ inputs.buildId }}
          path: builds-cli/${{ inputs.buildId }}/*.exe
          if-no-files-found: error

      # The installer is stored on a DRAFT release: it gives us a direct CDN
      # download (via a signed asset URL) without cluttering the public
      # Releases section. The Cloudflare function resolves the draft with the
      # GITHUB_PAT (which needs Contents access) and redirects the browser.
      - name: Publish Installer as Draft Release Asset
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_BUILD_ID: ${{ inputs.buildId }}
          INPUT_SITE_URL: ${{ inputs.siteUrl }}
        run: |
          TAG="build-$INPUT_BUILD_ID"
          gh release create "$TAG" "builds-cli/$INPUT_BUILD_ID"/*.exe \
            --repo "${{ github.repository }}" \
            --title "Windows build $TAG" \
            --notes "Automated Windows EXE for $INPUT_SITE_URL" \
            --draft
