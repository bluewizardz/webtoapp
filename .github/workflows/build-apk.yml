name: Build Android APK Wrapper

# The run title carries the build ID, so status polling can find this exact run
# even while several builds are running at the same time.
run-name: Build APK ${{ github.event.inputs.buildId }}

on:
  workflow_dispatch:
    inputs:
      siteUrl:
        description: 'Website URL to convert (e.g. https://example.com)'
        required: true
        default: 'https://example.com'
      appName:
        description: 'Application Name (e.g. My Portal)'
        required: true
        default: 'My Web App'
      appId:
        description: 'Application Package ID (e.g. com.example.app)'
        required: true
        default: 'com.example.app'
      appVersion:
        description: 'Application Version'
        required: true
        default: '1.0.0'
      pullToRefresh:
        description: 'Enable Pull-to-Refresh'
        type: boolean
        required: true
        default: true
      allowZoom:
        description: 'Enable Pinch-to-Zoom'
        type: boolean
        required: true
        default: false
      showSpinner:
        description: 'Enable Horizontal Load Progress Line'
        type: boolean
        required: true
        default: true
      showSplash:
        description: 'Enable Splash Screen'
        type: boolean
        required: true
        default: true
      splashDuration:
        description: 'Splash Screen Duration (ms)'
        required: true
        default: '2000'
      fullScreen:
        description: 'Enable Full Screen Mode'
        type: boolean
        required: true
        default: false
      customUserAgent:
        description: 'Custom User Agent String (Optional)'
        required: false
        default: ''
      buildId:
        description: 'Internal Build ID'
        required: true
        default: 'latest'
      icon:
        description: 'Custom launcher icon as a base64 image data URI (empty = favicon or generated icon)'
        required: false
        default: ''
      autoFetchIcon:
        description: 'Use the website favicon when no custom icon is supplied'
        type: boolean
        required: true
        default: true
      allowMixedContent:
        description: 'Allow insecure HTTP resources inside HTTPS pages (compatibility only)'
        type: boolean
        required: true
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: 'npm'

      - name: Install Dependencies
        run: |
          npm ci

      - name: Cache Gradle distribution and dependency caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle-android
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('builders/android-toolchain.js', 'builders/android-builder.js', 'builders/build-utils.js') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Verify Gradle cache
        run: |
          GRADLE_BIN="$HOME/.gradle-android/gradle-8.12.1/bin/gradle"
          if [ -x "$GRADLE_BIN" ]; then
            chmod +x "$GRADLE_BIN"
            echo "Cache hit: Gradle 8.12.1 restored from actions/cache"
            "$GRADLE_BIN" --version | head -5
          else
            echo "Cache miss: Gradle 8.12.1 will be downloaded during the build"
          fi

      - name: Set up Android SDK Environment Variables
        run: |
          if [ -z "$ANDROID_HOME" ]; then
            if [ -n "$ANDROID_SDK_ROOT" ]; then
              echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
            else
              echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
            fi
          fi

      # SECURITY: release signing material lives only in repository secrets. The
      # keystore is decoded into the runner temp directory, never committed, and
      # exported to Gradle through environment variables only.
      - name: Prepare optional release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "BUILD_VARIANT=debug" >> "$GITHUB_ENV"
            echo "No release keystore secret configured; building the debug variant."
            exit 0
          fi
          KEYSTORE_PATH="$RUNNER_TEMP/release.keystore"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          {
            echo "SITEAPP_KEYSTORE_PATH=$KEYSTORE_PATH"
            echo "SITEAPP_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD"
            echo "SITEAPP_KEY_ALIAS=$ANDROID_KEY_ALIAS"
            echo "SITEAPP_KEY_PASSWORD=$ANDROID_KEY_PASSWORD"
            echo "BUILD_VARIANT=release"
          } >> "$GITHUB_ENV"
          echo "Release signing configured; building the signed release APK."

      # SECURITY: workflow inputs are attacker-controlled. They are passed to the
      # CLI as environment variables and read inside Node, so no input is ever
      # interpolated into shell command text. Never add ${{ ... }} to this run
      # block; values would be evaluated by the shell on the runner.
      - name: Compile Android APK
        env:
          SITE_URL: ${{ github.event.inputs.siteUrl }}
          APP_NAME: ${{ github.event.inputs.appName }}
          APP_ID: ${{ github.event.inputs.appId }}
          APP_VERSION: ${{ github.event.inputs.appVersion }}
          PULL_TO_REFRESH: ${{ github.event.inputs.pullToRefresh }}
          SHOW_SPINNER: ${{ github.event.inputs.showSpinner }}
          SHOW_SPLASH: ${{ github.event.inputs.showSplash }}
          SPLASH_DURATION: ${{ github.event.inputs.splashDuration }}
          FULL_SCREEN: ${{ github.event.inputs.fullScreen }}
          CUSTOM_USER_AGENT: ${{ github.event.inputs.customUserAgent }}
          ALLOW_ZOOM: ${{ github.event.inputs.allowZoom }}
          BUILD_ID: ${{ github.event.inputs.buildId }}
          AUTO_FETCH_ICON: ${{ github.event.inputs.autoFetchIcon }}
          APP_ICON: ${{ github.event.inputs.icon }}
          ALLOW_MIXED_CONTENT: ${{ github.event.inputs.allowMixedContent }}
        run: node cli-build-apk.js

      - name: Locate Built APK and Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: 'build-${{ github.event.inputs.buildId }}'
          path: 'builds-cli/${{ github.event.inputs.buildId }}/*.apk'
          if-no-files-found: error
