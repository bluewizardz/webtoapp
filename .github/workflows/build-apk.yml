name: Build Android APK Wrapper

on:
  workflow_dispatch:
    inputs:
      siteUrl:
        description: 'Website URL to convert (e.g. https://example.com)'
        required: true
        default: 'https://example.com'
      appName:
        description: 'Application Name (e.g. My Portal)'
        required: true
        default: 'My Web App'
      appId:
        description: 'Application Package ID (e.g. com.example.app)'
        required: true
        default: 'com.example.app'
      appVersion:
        description: 'Application Version'
        required: true
        default: '1.0.0'
      pullToRefresh:
        description: 'Enable Pull-to-Refresh'
        type: boolean
        required: true
        default: true
      allowZoom:
        description: 'Enable Pinch-to-Zoom'
        type: boolean
        required: true
        default: false
      showSpinner:
        description: 'Enable Horizontal Load Progress Line'
        type: boolean
        required: true
        default: true
      showSplash:
        description: 'Enable Splash Screen'
        type: boolean
        required: true
        default: true
      splashDuration:
        description: 'Splash Screen Duration (ms)'
        required: true
        default: '2000'
      fullScreen:
        description: 'Enable Full Screen Mode'
        type: boolean
        required: true
        default: false
      customUserAgent:
        description: 'Custom User Agent String (Optional)'
        required: false
        default: ''
      icon:
        description: 'Optional Base64 image data URL for the app icon'
        required: false
        default: ''
      autoFetchIcon:
        description: 'Fetch a website favicon when no valid custom icon is provided'
        type: boolean
        required: true
        default: true
      buildId:
        description: 'Internal Build ID'
        required: true
        default: 'latest'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: 'npm'

      - name: Install Dependencies
        run: |
          npm ci

      - name: Cache Gradle distribution and dependency caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle-android
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-8.12.1-${{ hashFiles('builders/android-builder.js', 'builders/build-utils.js') }}
          restore-keys: |
            gradle-${{ runner.os }}-8.12.1-

      - name: Verify Gradle cache
        run: |
          GRADLE_BIN="$HOME/.gradle-android/gradle-8.12.1/bin/gradle"
          if [ -x "$GRADLE_BIN" ]; then
            chmod +x "$GRADLE_BIN"
            echo "Cache hit: Gradle 8.12.1 restored from actions/cache"
            "$GRADLE_BIN" --version | head -5
          else
            echo "Cache miss: Gradle 8.12.1 will be downloaded during the build"
          fi

      - name: Set up Android SDK Environment Variables
        run: |
          if [ -z "$ANDROID_HOME" ]; then
            if [ -n "$ANDROID_SDK_ROOT" ]; then
              echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
            else
              echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
            fi
          fi

      - name: Compile Android APK
        env:
          APP_ICON: ${{ inputs.icon }}
          AUTO_FETCH_ICON: ${{ inputs.autoFetchIcon }}
        run: |
          node cli-build-apk.js \
            "${{ github.event.inputs.siteUrl }}" \
            "${{ github.event.inputs.appName }}" \
            "${{ github.event.inputs.appId }}" \
            "${{ github.event.inputs.appVersion }}" \
            "${{ github.event.inputs.pullToRefresh }}" \
            "${{ github.event.inputs.showSpinner }}" \
            "${{ github.event.inputs.showSplash }}" \
            "${{ github.event.inputs.splashDuration }}" \
            "${{ github.event.inputs.fullScreen }}" \
            "${{ github.event.inputs.customUserAgent }}" \
            "${{ github.event.inputs.allowZoom }}" \
            "${{ github.event.inputs.buildId }}"

      - name: Locate Built APK and Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: 'build-${{ github.event.inputs.buildId }}'
          path: 'builds-cli/${{ github.event.inputs.buildId }}/*.apk'
          if-no-files-found: error
